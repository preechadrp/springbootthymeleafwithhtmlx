spring.application.name=springbootthymeleafwithhtmlx

# ใช้ virtual thread รับ request เพื่อไม่ให้งานที่รอนาน (เช่น Thread.sleep) กิน thread pool ของ Tomcat จนเต็ม
spring.threads.virtual.enabled=true

# อ่าน header X-Forwarded-* ที่ nginx / api-gateway ส่งมา เพื่อให้แอปรู้ scheme, host และ IP จริงของผู้ใช้
server.forward-headers-strategy=native
