<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>HTMX On Load Example</title>
    <script th:src="@{/webui/js/htmx.min.js}"></script>
    <link rel="stylesheet" th:href="@{/webui/css/my.css}">
</head>
<!-- hx-headers: ให้ HTMX แนบ CSRF token ไปกับทุก request ที่ยิงจากหน้านี้ -->
<body th:hx-headers='|{"${_csrf.headerName}": "${_csrf.token}"}|'>

    <h1>Test Redirect</h1>
    <h1>แดชบอร์ดสรุปผล</h1>
    <p>หน้าเว็บนี้โหลดเสร็จทันที แต่ข้อมูลด้านล่างจะตามมาทีหลัง...</p>

    <!-- 
      hx-post: ยิงไปที่ /webui/testredirect-process
      hx-trigger: ทำงานทันทีเมื่อ Element นี้ถูกโหลดขึ้นมาบนหน้าจอ (load)
      ไม่มีการ swap เนื้อหา เพราะ Server ตอบกลับด้วย Header HX-Redirect ให้ไปหน้าอื่นแทน
    -->
    <div th:hx-post="@{/webui/testredirect-process}" 
         hx-trigger="load" 
         hx-indicator="#loading-spinner">
    </div>

    <div id="loading-spinner" class="htmx-indicator loading-overlay">
        <h3>Processing<span class="dots"></span></h3>
    </div>

</body>
</html>
