<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Spring Boot + HTMX</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <!-- ปิดฟีเจอร์ของ HTMX ที่ขัดกับ CSP / เสี่ยงต่อ XSS -->
    <meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false,"selfRequestsOnly":true}'>
    <script th:src="@{/webui/js/htmx.min.js}"></script>
    <script th:src="@{/webui/js/htmx-csrf.js}"></script>
    <link rel="stylesheet" th:href="@{/webui/css/my.css}">
</head>
<body>
    <h1>HTMX Demo</h1>

    <div id="contact-section">
     aaaa
        <button th:hx-get="@{/webui/contact/1}" 
                hx-target="#contact-section" 
                hx-swap="innerHTML">
            Show Contact Info
        </button>
    </div>
</body>
</html>
