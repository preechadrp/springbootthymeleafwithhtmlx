<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>HTMX POST Form</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <!-- ปิดฟีเจอร์ของ HTMX ที่ขัดกับ CSP / เสี่ยงต่อ XSS -->
    <meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false,"selfRequestsOnly":true}'>
    <script th:src="@{/webui/js/htmx.min.js}"></script>
    <script th:src="@{/webui/js/htmx-csrf.js}"></script>
    <link rel="stylesheet" th:href="@{/webui/css/my.css}">
</head>
<body>
    <h2>เพิ่มพนักงานใหม่</h2>

    <!-- HTMX จะส่ง Form นี้แบบ POST ไปที่ /webui/employee -->
    <form th:hx-post="@{/webui/employee}" 
          hx-target="#response-area" 
          hx-swap="innerHTML">
        
        <div>
            <label>ชื่อ:</label>
            <input type="text" name="name" required>
        </div>
        <br>
        <div>
            <label>ตำแหน่ง:</label>
            <input type="text" name="role" required>
        </div>
        <br>
        <button type="submit">บันทึกข้อมูล</button>
    </form>

    <!-- จุดที่แสดงผลลัพธ์หลังจากกด Save -->
    <div id="response-area"></div>

</body>
</html>
